<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 36" fill="none">
  <!-- Ghat steps descending to river -->
  <path d="M10 28 L10 24 L15 24 L15 20 L20 20 L20 16 L25 16 L25 12" stroke="#111C30" stroke-width="1.4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Temple dome silhouette -->
  <path d="M27 12 Q30 5, 33 12" stroke="#111C30" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <!-- Temple spire -->
  <line x1="30" y1="5" x2="30" y2="2" stroke="#D68A24" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Small dome finial -->
  <circle cx="30" cy="1.5" r="0.8" fill="#D68A24"/>
  <!-- Second smaller structure -->
  <path d="M35 16 L35 13 Q37 9, 39 13 L39 16" stroke="#111C30" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <line x1="37" y1="9" x2="37" y2="7" stroke="#D68A24" stroke-width="1.2" stroke-linecap="round"/>
  <!-- River flowing curve -->
  <path d="M3 32 C12 28, 20 30, 28 29 S40 27, 50 30" stroke="#D68A24" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Subtle second river line -->
  <path d="M5 34 C14 31, 22 33, 30 31.5 S42 30, 50 32" stroke="#D68A24" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.4"/>
</svg>
